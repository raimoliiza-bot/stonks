name: Fear & Greed
# Kaks korda päevas: hommikul (eelmise päeva sulgemine) ja enne serveri kella 22 uuendust.
on:
  schedule:
    - cron: "7 5,17 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fg:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/fg.py
      - name: Salvesta muudatus
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898333+github-actions[bot]@users.noreply.github.com"
          git add data/fg.json
          git diff --cached --quiet || (git commit -m "Fear & Greed $(date -u +%F)" && git push)

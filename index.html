<!DOCTYPE html>
<html lang="et">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Portfell</title>
<meta name="theme-color" content="#0f141b">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0f141b; --surface:#161c25; --raised:#1e2631; --line:#28323f; --line-soft:#1f2732;
    --text:#e9edf3; --muted:#93a0b1; --faint:#63708280;
    --gold:#f5c04e; --blue:#60a5fa; --up:#45c97f; --down:#f26d6a;
    --s-value:#bb8820; --s-paid:#4a8fec;          /* graafiku jooned (kontrollitud tumedal taustal) */
    --r-lg:18px; --r-md:12px; --r-sm:8px;
  }
  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{margin:0;background:var(--bg);color:var(--text);
    font-family:"IBM Plex Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    font-size:15px;line-height:1.4;-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
  button,input,select{font:inherit;color:inherit}
  button{cursor:pointer}
  :focus-visible{outline:2px solid var(--blue);outline-offset:2px}
  .wrap{max-width:880px;margin:0 auto;padding:14px 16px 56px}
  .up{color:var(--up)} .down{color:var(--down)} .muted{color:var(--muted)}

  /* ülariba */
  .bar{display:flex;align-items:center;gap:10px;margin-bottom:12px}
  .bar h1{font-size:17px;font-weight:600;margin:0;letter-spacing:-.01em}
  .bar .grow{flex:1}
  .seg{display:inline-flex;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:3px}
  .seg button{border:0;background:none;color:var(--muted);padding:6px 13px;border-radius:999px;font-size:13px;font-weight:500;white-space:nowrap}
  .seg button[aria-pressed="true"]{background:var(--raised);color:var(--text);box-shadow:inset 0 0 0 1px var(--line)}
  .btn{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 14px;font-size:14px;font-weight:500}
  .btn.icon{width:38px;height:38px;padding:0;display:grid;place-items:center;color:var(--muted)}
  .btn.icon svg{width:17px;height:17px}
  .btn.icon.busy svg{animation:spin .9s linear infinite}
  .btn.primary{background:var(--gold);border-color:var(--gold);color:#1a1405;font-weight:600}
  .btn.primary:disabled{opacity:.45;cursor:not-allowed}
  @keyframes spin{to{transform:rotate(360deg)}}

  .nav{display:flex;gap:22px;border-bottom:1px solid var(--line);margin-bottom:22px}
  .nav button{border:0;background:none;color:var(--muted);padding:9px 0 10px;font-size:14.5px;font-weight:500;border-bottom:2px solid transparent;margin-bottom:-1px}
  .nav button[aria-pressed="true"]{color:var(--text);border-bottom-color:var(--gold)}

  /* kangelane: summa + graafik */
  .hero-top{display:flex;justify-content:space-between;align-items:flex-end;gap:14px;flex-wrap:wrap}
  .hero .lbl{color:var(--muted);font-size:13px}
  .total{font-size:clamp(38px,10vw,56px);font-weight:600;letter-spacing:-.035em;line-height:1.02;color:var(--gold)}
  .total small{font-size:.5em;font-weight:500;letter-spacing:0;margin-left:.12em;opacity:.8}
  .today{text-align:right;padding-bottom:6px}
  .today b{display:block;font-size:22px;font-weight:600;letter-spacing:-.02em}
  .today span{font-size:13px}
  .chart-ctl{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:18px 0 8px;flex-wrap:wrap}
  .legend{display:flex;gap:16px;font-size:12.5px;color:var(--muted);margin:0 0 4px;min-height:18px;flex-wrap:wrap}
  .legend i{display:inline-block;width:14px;height:3px;border-radius:2px;margin-right:6px;vertical-align:middle}
  .legend b{color:var(--text);font-weight:500;margin-left:5px}
  #chart,#day{position:relative;touch-action:pan-y}
  #chart svg,#day svg{display:block;width:100%;overflow:visible}
  :is(#chart,#day) .tip{position:absolute;top:0;pointer-events:none;background:var(--raised);border:1px solid var(--line);
    border-radius:var(--r-sm);padding:8px 10px;font-size:12.5px;line-height:1.5;white-space:nowrap;box-shadow:0 8px 24px #0008;display:none}
  :is(#chart,#day) .tip strong{display:block;font-weight:600;margin-bottom:2px}
  :is(#chart,#day) .tip span{color:var(--muted);margin-right:8px}
  :is(#chart,#day) .tip div{display:flex;justify-content:space-between}
  .empty{color:var(--muted);font-size:13.5px;padding:34px 0;text-align:center;margin:0}
  details.tbl{margin-top:6px;font-size:12.5px;color:var(--muted)}
  details.tbl summary{cursor:pointer;width:max-content}
  details.tbl table{margin-top:8px;max-width:520px}

  /* näitajad: joontega eraldatud, mitte kaardid */
  .stats{display:grid;grid-template-columns:repeat(4,1fr);margin:0;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
  .stats > div{padding:14px 14px 14px 0}
  .stats > div + div{padding-left:14px;border-left:1px solid var(--line)}
  .stats dt{color:var(--muted);font-size:12.5px;margin:0 0 3px}
  .stats dd{margin:0;font-size:19px;font-weight:600;letter-spacing:-.02em}
  .stats dd small{display:block;font-size:12.5px;font-weight:400;letter-spacing:0;color:var(--muted);margin-top:1px}
  .split{display:flex;gap:22px;flex-wrap:wrap;font-size:13px;color:var(--muted);padding:10px 0 0}
  .split b{color:var(--text);font-weight:500;margin-left:6px}
  @media (max-width:640px){
    .stats{grid-template-columns:repeat(2,1fr)}
    .stats > div:nth-child(3){padding-left:0;border-left:0}
    .stats > div:nth-child(n+3){border-top:1px solid var(--line)}
  }

  /* jaotised */
  .sec{margin-top:34px}
  .sec-h{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap}
  .sec-h h2{font-size:16px;font-weight:600;margin:0;letter-spacing:-.01em}
  .fold-b{border:0;background:none;padding:4px 0;font:inherit;letter-spacing:inherit;display:inline-flex;align-items:center;gap:7px}
  .fold-b svg{width:15px;height:15px;color:var(--muted);transition:transform .15s}
  .fold.kinni .fold-b svg{transform:rotate(-90deg)}
  .fold.kinni .sec-h{margin-bottom:0}
  .fold.kinni{padding-bottom:12px;border-bottom:1px solid var(--line-soft)}
  .sec.fold.kinni{margin-top:12px}
  .sec.fold.kinni + .sec.fold:not(.kinni){margin-top:26px}
  .sec-h p.fold-s{font-size:13.5px;text-align:right}
  .fold-s b{font-weight:600;color:var(--text)} .fold-s b.gold{color:var(--gold)} .fold-s b.up{color:var(--up)} .fold-s b.down{color:var(--down)}
  .sec-h p{margin:0;font-size:12.5px;color:var(--muted)}

  /* kaart (heatmap) */
  #heat{position:relative;width:100%;height:min(86vw,430px);border-radius:var(--r-md);overflow:hidden;background:#000}
  .tile{position:absolute;overflow:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;
    color:#fff;text-align:center;border:0;padding:0;border-radius:4px;line-height:1.1;text-shadow:0 1px 2px rgba(0,0,0,.5)}
  .tile b{font-weight:700;letter-spacing:-.01em}
  .tile span{opacity:.92}
  .scale{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted);margin-top:8px}
  .scale i{flex:0 0 120px;height:6px;border-radius:3px}

  /* tabelid */
  table{width:100%;border-collapse:collapse;font-size:14px}
  th,td{padding:10px 0 10px 10px;text-align:right;border-bottom:1px solid var(--line-soft);vertical-align:top}
  th:first-child,td:first-child{text-align:left;padding-left:0}
  th{color:var(--muted);font-weight:500;font-size:12.5px;border-bottom-color:var(--line);white-space:nowrap}
  th button{border:0;background:none;color:inherit;padding:0;font-weight:inherit}
  th button[aria-sort]:not([aria-sort="none"]){color:var(--text)}
  td small{display:block;color:var(--muted);font-size:12px;font-weight:400}
  td.nm b{font-weight:600}
  td.val{color:var(--blue);font-weight:500}
  tr.row{cursor:pointer}
  tr.row:hover td{background:#ffffff06}
  tr.sum td{border-bottom:0;border-top:1px solid var(--line);font-weight:600;padding-top:12px}
  tr.det td{padding:0 0 14px;border-bottom:1px solid var(--line-soft)}
  .detbox{background:var(--surface);border-radius:var(--r-md);padding:14px;text-align:left}
  .detgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px 16px}
  .detgrid div span{display:block;color:var(--muted);font-size:12px}
  .detgrid div b{font-weight:500}
  .range{margin-top:14px;font-size:12px;color:var(--muted)}
  .range .track{position:relative;height:4px;border-radius:2px;background:var(--line);margin:7px 0 5px}
  .range .track i{position:absolute;top:-4px;width:12px;height:12px;border-radius:50%;background:var(--text);border:2px solid var(--surface);transform:translateX(-50%)}
  .range .ends{display:flex;justify-content:space-between}
  .detact{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap;align-items:center}
  .badge{display:inline-block;font-size:11.5px;padding:2px 8px;border-radius:999px;background:#f5c04e22;color:var(--gold);margin-left:6px;font-weight:500;vertical-align:1px}
  @media (max-width:560px){
    table{font-size:13.5px}
    .col-yr{display:none}
    .detgrid{grid-template-columns:repeat(2,1fr)}
  }

  /* päeva võrdlus turuga */
  .cmp{display:grid;grid-template-columns:max-content 1fr max-content;gap:9px 12px;align-items:center;font-size:14px}
  .cmp .bar2{position:relative;height:14px;background:linear-gradient(var(--line),var(--line)) center/1px 100% no-repeat}
  .cmp .bar2 i{position:absolute;top:2px;bottom:2px;border-radius:3px;min-width:2px}
  .cmp .v{text-align:right;font-weight:500}
  .cmp small{color:var(--muted);font-size:12px;margin-left:6px}
  .cmp-note{font-size:13.5px;color:var(--muted);margin:12px 0 0}
  .cmp-note b{color:var(--text);font-weight:500}
  .clicky{cursor:pointer}
  .clicky:hover dt,.clicky:hover td:first-child b{text-decoration:underline;text-underline-offset:3px}

  /* seaded */
  .set{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:16px;margin-bottom:14px}
  .set h3{font-size:15px;font-weight:600;margin:0 0 4px}
  .set p{margin:0 0 12px;font-size:13.5px;color:var(--muted)}
  .set .line{display:flex;gap:8px;align-items:center;margin-top:8px;flex-wrap:wrap}
  .set .line span{flex:0 0 68px;font-size:14px}
  .set input{flex:1 1 90px;min-width:0;background:var(--bg);border:1px solid var(--line);border-radius:var(--r-sm);padding:9px 11px;font-size:16px}
  .set input:focus{border-color:var(--blue);outline:0}
  .yr-s,.yr-m{}
  @media (max-width:560px){ .yr-s{display:none} }

  /* vara jaotus */
  .vara{display:flex;gap:22px;align-items:center;flex-wrap:wrap}
  .varagraaf{display:flex;gap:14px;flex:0 1 auto;justify-content:flex-start;max-width:100%}
  .varagraaf svg{flex:1 1 0;width:180px;max-width:180px;min-width:0;height:auto}
  .varagraaf [data-sektor]:focus-visible{outline:none;stroke:var(--text);stroke-width:3}
  .varalist{list-style:none;margin:0;padding:0;flex:1 1 220px;min-width:0}
  .varalist li{display:grid;grid-template-columns:12px 1fr auto 52px;gap:10px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line-soft);font-size:14.5px}
  .varalist li i{width:12px;height:12px;border-radius:3px}
  .varalist li b{font-weight:500}
  .varalist li.edit label input{flex:none;width:100%}
  .varalist li em{display:inline-block;width:100%;font-style:normal;font-size:12.5px;color:var(--muted);margin-top:1px}
  .varalist li em.up,.varalist li em .up{color:var(--up)} .varalist li em.down,.varalist li em .down{color:var(--down)}
  .varalist li.edit label{flex:1 1 130px;font-size:12.5px;color:var(--muted);display:flex;flex-direction:column;gap:4px}
  .varalist li small{color:var(--muted);text-align:right;font-size:13px}
  .varalist li.clicky:hover span{text-decoration:underline;text-underline-offset:3px}
  .varalist li.edit{display:flex;gap:8px;flex-wrap:wrap;padding:10px 0 14px}
  .varalist li.edit input,.varauus input{flex:1 1 110px;min-width:0;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-sm);padding:9px 11px;font-size:16px}
  .varauus{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
  .btn.danger{color:var(--down);border-color:#f26d6a55}
  .btn.link{border:0;background:none;padding:0;color:var(--blue);font-size:inherit}
  .juhend summary{cursor:pointer;list-style:none;display:flex;align-items:center;gap:8px}
  .juhend summary::-webkit-details-marker{display:none}
  .juhend summary::before{content:"";width:8px;height:8px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(-45deg);transition:transform .15s;margin:0 4px 2px 2px}
  .juhend[open] summary::before{transform:rotate(45deg)}
  .juhend summary h3{margin:0}
  .juhend > p{margin-top:12px}
  .juhend ol{margin:0 0 14px;padding:0;list-style:none;counter-reset:s}
  .juhend ol li{counter-increment:s;display:grid;grid-template-columns:28px 1fr;gap:2px 10px;padding:12px 0;border-top:1px solid var(--line-soft);font-size:14px}
  .juhend ol li::before{content:counter(s);grid-row:1/3;width:26px;height:26px;border-radius:50%;background:var(--raised);border:1px solid var(--line);display:grid;place-items:center;font-size:13px;font-weight:600}
  .juhend ol li b{font-weight:600}
  .juhend ol li span{grid-column:2;color:var(--muted);line-height:1.5}
  .juhend code{background:var(--bg);border:1px solid var(--line);border-radius:5px;padding:1px 5px;font-size:12.5px;color:var(--text)}
  .juhend a{color:var(--blue)}

  /* turg ja varad */
  .strip{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r-lg);overflow:hidden}
  .strip > div{background:var(--surface);padding:13px 14px;min-width:0}
  .strip span{display:block;color:var(--muted);font-size:12.5px}
  .strip b{display:block;font-size:18px;font-weight:600;letter-spacing:-.02em;margin:1px 0}
  .strip small{font-size:12.5px;color:var(--muted)}

  /* tehingute nimekiri */
  .tx{list-style:none;margin:0;padding:0}
  .tx li{display:grid;grid-template-columns:86px 1fr auto;gap:10px;padding:10px 0;border-bottom:1px solid var(--line-soft);font-size:14px;align-items:baseline}
  .tx time{color:var(--muted);font-size:12.5px}
  .tx small{color:var(--muted);font-size:12.5px;margin-left:6px}

  .note{background:#f5c04e14;border:1px solid #f5c04e40;color:#f3d48d;border-radius:var(--r-md);padding:10px 12px;font-size:13.5px;margin-bottom:16px}
  .foot{color:var(--muted);font-size:12.5px;margin-top:36px;padding-top:14px;border-top:1px solid var(--line)}
  .state{padding:90px 0;text-align:center;color:var(--muted)}
  .state b{display:block;color:var(--text);font-weight:600;margin-bottom:6px}

  /* tehinguvorm */
  dialog{border:1px solid var(--line);background:var(--surface);color:var(--text);border-radius:var(--r-lg);padding:0;
    width:min(460px,calc(100vw - 24px));max-height:calc(100dvh - 24px);box-shadow:0 30px 80px #000a}
  dialog::backdrop{background:#070a0ecc}
  dialog form{padding:18px 18px 16px}
  dialog header{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
  dialog h2{font-size:17px;font-weight:600;margin:0}
  .x{border:0;background:none;color:var(--muted);font-size:22px;line-height:1;padding:4px 8px}
  .types{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:14px}
  .types button{border:1px solid var(--line);background:var(--bg);border-radius:var(--r-sm);padding:9px 2px;font-size:13px;color:var(--muted);font-weight:500}
  .types button[aria-pressed="true"]{border-color:var(--gold);color:var(--text);background:#f5c04e14}
  .f{margin-bottom:12px}
  .f label{display:flex;justify-content:space-between;font-size:12.5px;color:var(--muted);margin-bottom:4px}
  .f label button{border:0;background:none;color:var(--blue);padding:0;font-size:12.5px}
  .f input{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:var(--r-sm);padding:10px 11px;font-size:16px}
  .f input:focus{border-color:var(--blue);outline:0}
  .f .hint{font-size:12.5px;color:var(--muted);margin-top:4px;min-height:17px}
  .two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .sumbox{background:var(--bg);border-radius:var(--r-sm);padding:10px 12px;font-size:13.5px;margin:4px 0 12px;color:var(--muted)}
  .sumbox b{color:var(--text);font-weight:600}
  .sumbox div{display:flex;justify-content:space-between}
  .err{color:var(--down);font-size:13.5px;margin:0 0 10px;min-height:0}
  .chk{display:flex;align-items:center;gap:7px;font-size:12.5px;color:var(--muted);margin-top:6px}
  .f label.chk{justify-content:flex-start}
  .chk input{width:auto}
  dialog .btn.primary{width:100%;padding:12px;border-radius:var(--r-md);font-size:15px}
  [hidden]{display:none!important}

  #toast{position:fixed;left:50%;bottom:22px;transform:translate(-50%,20px);background:var(--raised);border:1px solid var(--line);
    padding:10px 16px;border-radius:999px;font-size:14px;opacity:0;transition:opacity .2s,transform .2s;pointer-events:none;box-shadow:0 10px 30px #0009;max-width:calc(100vw - 32px)}
  #toast.on{opacity:1;transform:translate(-50%,0)}
  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <div class="bar">
    <h1>Portfell</h1>
    <div class="grow"></div>
    <button class="btn icon" id="btnRefresh" aria-label="Värskenda hinnad" title="Värskenda hinnad">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/></svg>
    </button>
    <button class="btn primary" id="btnAdd">Lisa tehing</button>
  </div>
  <div class="nav" id="nav">
    <button type="button" data-view="portfell" aria-pressed="true">Portfell</button>
    <button type="button" data-view="ulevaade" aria-pressed="false">Tootlus ja vara</button>
    <button type="button" data-view="seaded" aria-pressed="false">Seaded</button>
  </div>
  <div id="app"><div class="state">Laen andmeid…</div></div>
  <div class="foot" id="foot" hidden></div>
</div>

<dialog id="dlg" aria-labelledby="dlgH">
  <form id="frm" novalidate>
    <header><h2 id="dlgH">Lisa tehing</h2><button type="button" class="x" id="dlgX" aria-label="Sulge">×</button></header>
    <div class="types" id="types"></div>
    <div class="f" id="fTicker">
      <label for="iTicker">Väärtpaber</label>
      <input id="iTicker" list="dl" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="nt VWRL või NKE">
      <datalist id="dl"></datalist>
      <div class="hint" id="hTicker"></div>
    </div>
    <div class="two" id="fTrade">
      <div class="f"><label for="iKogus">Kogus <button type="button" id="bAll" hidden>Kõik</button></label><input id="iKogus" inputmode="decimal"></div>
      <div class="f"><label for="iHind" id="lHind">Hind</label><input id="iHind" inputmode="decimal"></div>
    </div>
    <div class="two">
      <div class="f" id="fSumma"><label for="iSumma" id="lSumma">Summa, €</label><input id="iSumma" inputmode="decimal"></div>
      <div class="f" id="fTasu"><label for="iTasu">Teenustasu, €</label><input id="iTasu" inputmode="decimal" placeholder="0"></div>
      <div class="f"><label for="iKp">Kuupäev</label><input id="iKp" type="date"></div>
    </div>
    <div class="f"><label for="iMarkus">Märkus</label><input id="iMarkus" maxlength="100" placeholder="valikuline"></div>
    <div class="sumbox" id="sumbox" hidden></div>
    <div class="f" id="fPin">
      <label for="iPin">PIN</label>
      <input id="iPin" type="password" inputmode="numeric" autocomplete="off">
      <label class="chk"><input type="checkbox" id="cPin"> Jäta PIN selles seadmes meelde</label>
    </div>

<script>
// ============================================================
// Apps Script /exec lingi saab sisestada äpis vahekaardil "Seaded" (jääb selles seadmes meelde).
// Soovi korral võid selle ka siia kirjutada; /exec lingi kaudu avades pole seda vaja.
var API_URL = '';
// ============================================================

var DEMO = /*DEMO*/null/*DEMO*/;
var S = { varaTyyp:'summa', kinni:{}, data:null, p:null, view:'portfell', bm:0, mode:'v', range:'all', heat:'tana', sort:{k:'v',dir:-1}, open:null, tyyp:'Ost', busy:false, demo:false };
var CB_N = 0;
function $(id){ return document.getElementById(id); }
function store(k,v){ try{ if(v===undefined) return localStorage.getItem(k)||''; if(v===null||v==='') localStorage.removeItem(k); else localStorage.setItem(k,v); }catch(e){} return ''; }
var INSIDE = typeof google!=='undefined' && google.script && google.script.run;
try{ S.kinni=JSON.parse(store('pf_kinni')||'{}')||{}; }catch(e){ S.kinni={}; }
function apiUrl(){ return (store('pf_api')||API_URL||'').trim(); }
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];}); }

// ---------- server ----------
function api(tegevus, q, ok, fail){
  var done = function(r){ if (r && r.viga) fail(new Error(r.viga)); else ok(r); };
  if (INSIDE){
    google.script.run.withSuccessHandler(done).withFailureHandler(fail).PF_api(tegevus, JSON.stringify(q||{}));
    return;
  }
  var API=apiUrl(); S.demo=false;
  if (API){
    var base=API+(API.indexOf('?')>-1?'&':'?')+'a='+encodeURIComponent(tegevus)+'&q='+encodeURIComponent(JSON.stringify(q||{}));
    // Varutee: JSONP (script-silt). Kasutatakse ainult siis, kui fetch ei õnnestu.
    var jsonp=function(esimeneViga){
      var cb='PF_cb_'+(++CB_N), tag=document.createElement('script');
      var timer=setTimeout(function(){ clean(); fail(new Error('Server ei vastanud. Kontrolli linki vahekaardil Seaded ja et web-app on avatud kõigile, kellel on link.')); },40000);
      function clean(){ clearTimeout(timer); try{ delete window[cb]; }catch(e){} if(tag.parentNode) tag.parentNode.removeChild(tag); }
      window[cb]=function(r){ clean(); done(r); };
      tag.src=base+'&cb='+cb;
      tag.onerror=function(){ clean(); var e=new Error('Server ei andnud andmeid.'); e.yhendus=true; e.detail=esimeneViga; fail(e); };
      document.body.appendChild(tag);
    };
    // Põhitee: fetch ilma küpsisteta. Nii ei sega telefonis sisse logitud Google'i kontod (sama olukord mis inkognito aknas).
    if (typeof fetch==='function'){
      var ctl=typeof AbortController==='function'?new AbortController():null, t2=setTimeout(function(){ if(ctl) ctl.abort(); },40000);
      // Sama kutse, mis bankrolli lehel: lihtne GET, brauser ise küpsiseid kaasa ei pane.
      fetch(base+'&_='+Date.now(),{method:'GET',mode:'cors',signal:ctl?ctl.signal:undefined})
        .then(function(r){ if(!r.ok) throw new Error('HTTP '+r.status); return r.text(); })
        .then(function(txt){ clearTimeout(t2); var j; try{ j=JSON.parse(txt); }catch(e){ throw new Error('vastus ei olnud andmed (uuenda liveapi ja tee uus versioon)'); } done(j); })
        .catch(function(e){ clearTimeout(t2); jsonp(String(e&&e.message||e)); });
    } else jsonp('');
    return;
  }
  if (!DEMO){ S.view='seaded'; setTimeout(function(){ fail(new Error('Kleebi ülal oma /exec link ja vajuta „Salvesta link“. Siis laeb leht sinu andmed.')); },0); return; }
  S.demo=true;
  if (tegevus==='tehing') { setTimeout(function(){ fail(new Error('Need on näidisandmed – tehinguid siin ei salvestata.')); },200); return; }
  setTimeout(function(){ ok(DEMO); },150);
}

// ---------- vormingud ----------
// Eesti vorming alati tühikuga tuhandete vahel (ka 4-kohalistel): 6 962 ja 1 505,53
function mkf(minD,maxD){ var f=new Intl.NumberFormat('en-US',{minimumFractionDigits:minD,maximumFractionDigits:maxD});
  return { format:function(n){ return f.format(n).replace(/,/g,'\u00a0').replace('.',',').replace('-','−'); } }; }
var nf0=mkf(0,0), nf1=mkf(1,1), nf2=mkf(2,2);
var KUUD=['jaan','veebr','märts','apr','mai','juuni','juuli','aug','sept','okt','nov','dets'];
function has(n){ return typeof n==='number' && isFinite(n); }
function sign(n){ return n>0?'+':(n<0?'−':''); }
function eur(n){ return has(n) ? (n<0?'−':'')+nf0.format(Math.abs(Math.round(n)))+' €' : '–'; }
function eurS(n){ return has(n) ? sign(Math.round(n))+nf0.format(Math.abs(Math.round(n)))+' €' : '–'; }
function eur2(n){ return has(n) ? (n<0?'−':'')+nf2.format(Math.abs(n))+' €' : '–'; }
function pct(f){ if(!has(f)) return '–'; var v=f*100, a=Math.abs(v); return sign(Math.round(v*100)/100)+(a>=100?nf0.format(a):a>=10?nf1.format(a):nf2.format(a))+'%'; }
function price(n){ if(!has(n)) return '–'; var a=Math.abs(n); return mkf(2,a<1?4:2).format(n); }
function qty(n){ return has(n) ? mkf(0,6).format(n) : '–'; }
function cls(n){ return has(n) ? (n>0?'up':(n<0?'down':'')) : 'muted'; }
function ms(d){ var p=d.split('-'); return Date.UTC(+p[0],+p[1]-1,+p[2]); }
function kp(d, lyhike){ var p=d.split('-'); return (+p[2])+'. '+KUUD[+p[1]-1]+(lyhike?'':' '+p[0]); }
function num(s){ var v=parseFloat(String(s||'').replace(/[\s ]/g,'').replace(',','.')); return isFinite(v)?v:NaN; }

// ---------- graafik ----------
function rangePts(){
  var a=S.data.ajalugu||[]; if(!a.length) return a;
  var last=a[a.length-1].d;
  if(S.range==='ytd'){ var y=last.slice(0,4), out=[], prev=null; a.forEach(function(p){ if(p.d.slice(0,4)<y) prev=p; else out.push(p); }); return prev?[prev].concat(out):out; }
  if(S.range==='30'){ var lim=ms(last)-30*864e5; return a.filter(function(p){ return ms(p.d)>=lim; }); }
  return a;
}
function niceTicks(lo,hi,n){
  var span=hi-lo||1, raw=span/n, mag=Math.pow(10,Math.floor(Math.log10(raw))), norm=raw/mag;
  var step=(norm<1.5?1:norm<3?2:norm<7?5:10)*mag, t=[], v=Math.ceil(lo/step)*step;
  for(;v<=hi+1e-9;v+=step) t.push(Math.round(v/step)*step);
  return t;
}
function drawChart(){
  var box=$('chart'); if(!box) return;
  var pts=rangePts(), lg=$('legend');
  if(pts.length<2){ box.innerHTML='<p class="empty">Selle vahemiku graafik täitub päev-päevalt: iga õhtu lisandub üks punkt.</p>'; lg.innerHTML=''; $('tblwrap').innerHTML=''; return; }
  var vd=S.data.vordlus||[], bmN=vd[S.bm]?vd[S.bm].kuva:'', onB=false;
  if(S.mode==='h' && vd.length){
    var wb=pts.filter(function(p){ return p.b && has(p.b[S.bm]); });
    if(wb.length>=2){ pts=wb; onB=true; }
  }
  var W=box.clientWidth, H=W<520?210:250, m={t:12,b:24,l:0,r:0}, h0=pts[0].h, b0=onB?pts[0].b[S.bm]:1;
  var pf=function(v){return pct(v/100);};
  var ser = S.mode==='v'
    ? [{k:'v',c:'var(--s-value)',n:'Väärtus',f:eur},{k:'s',c:'var(--s-paid)',n:'Sisse makstud',f:eur}]
    : (onB ? [{k:'r',c:'var(--s-value)',n:'Portfell',f:pf},{k:'m',c:'var(--s-paid)',n:bmN,f:pf}] : [{k:'r',c:'var(--s-value)',n:'Tootlus',f:pf}]);
  var P=pts.map(function(p){ return {d:p.d,t:ms(p.d),v:p.v,s:p.s,h:p.h,r:(p.h/h0-1)*100,m:onB?(p.b[S.bm]/b0-1)*100:0}; });
  var lo=Infinity,hi=-Infinity; P.forEach(function(p){ ser.forEach(function(s){ lo=Math.min(lo,p[s.k]); hi=Math.max(hi,p[s.k]); }); });
  var pad=(hi-lo||1)*0.1; lo-=pad; hi+=pad; if(S.mode==='v' && lo<0) lo=0;
  var t0=P[0].t, t1=P[P.length-1].t;
  var X=function(t){ return m.l+(t-t0)/(t1-t0)*(W-m.l-m.r); }, Y=function(v){ return m.t+(1-(v-lo)/(hi-lo))*(H-m.t-m.b); };
  var svg='<svg viewBox="0 0 '+W+' '+H+'" height="'+H+'" role="img" aria-label="'+(S.mode==='v'?'Portfelli väärtus ja sissemaksed ajas':'Portfelli tootlus ajas')+'">';
  niceTicks(lo,hi,4).forEach(function(v){
    var y=Y(v); if(y<m.t+6||y>H-m.b) return;
    svg+='<line x1="0" x2="'+W+'" y1="'+y+'" y2="'+y+'" stroke="var(--line-soft)"/>'+
         '<text x="0" y="'+(y-5)+'" fill="var(--muted)" font-size="11.5">'+(v===0?'0':S.mode==='v'?nf0.format(v/1000)+' tuh €':sign(v)+nf0.format(Math.abs(v))+'%')+'</text>';
  });
  // x-telg
  var marks=[], days=(t1-t0)/864e5;
  if(days>500){ for(var y=new Date(t0).getUTCFullYear()+1;y<=new Date(t1).getUTCFullYear();y++) marks.push({t:Date.UTC(y,0,1),l:String(y)}); }
  else { var n=Math.min(5,P.length); for(var i=0;i<n;i++){ var q=P[Math.round(i*(P.length-1)/(n-1))]; marks.push({t:q.t,l:kp(q.d,true)}); } }
  var lastX=-99;
  marks.forEach(function(k){ var x=X(k.t); if(x-lastX<52||x>W-18) return; lastX=x;
    svg+='<text x="'+x+'" y="'+(H-6)+'" fill="var(--muted)" font-size="11.5" text-anchor="'+(x<20?'start':'middle')+'">'+k.l+'</text>'; });
  var path=function(k){ return P.map(function(p,i){ return (i?'L':'M')+X(p.t).toFixed(1)+' '+Y(p[k]).toFixed(1); }).join(''); };
  if(S.mode==='v'){
    svg+='<path d="'+path('v')+P.slice().reverse().map(function(p){ return 'L'+X(p.t).toFixed(1)+' '+Y(p.s).toFixed(1); }).join('')+'Z" fill="var(--s-value)" opacity=".13"/>';
  }
  ser.slice().reverse().forEach(function(s){
    svg+='<path d="'+path(s.k)+'" fill="none" stroke="'+s.c+'" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>';
    if(P.length<=30) P.forEach(function(p){ svg+='<circle cx="'+X(p.t)+'" cy="'+Y(p[s.k])+'" r="3.5" fill="'+s.c+'" stroke="var(--bg)" stroke-width="2"/>'; });
  });
  svg+='<g id="cross" style="display:none"><line id="cl" y1="'+m.t+'" y2="'+(H-m.b)+'" stroke="var(--muted)" stroke-dasharray="3 3"/>'+
       ser.map(function(s,i){ return '<circle id="cd'+i+'" r="5" fill="'+s.c+'" stroke="var(--text)" stroke-width="2"/>'; }).join('')+'</g></svg><div class="tip" id="tip"></div>';
  box.innerHTML=svg;
  var L=P[P.length-1];
  lg.innerHTML = S.mode==='v'
    ? ser.map(function(s){ return '<span><i style="background:'+s.c+'"></i>'+s.n+'<b>'+s.f(L[s.k])+'</b></span>'; }).join('')+'<span>Vahe on kasum<b class="'+cls(L.v-L.s)+'">'+eurS(L.v-L.s)+'</b></span>'
    : (onB ? ser.map(function(s){ return '<span><i style="background:'+s.c+'"></i>'+esc(s.n)+'<b class="'+cls(L[s.k])+'">'+pf(L[s.k])+'</b></span>'; }).join('')+
              '<span>Vahe<b class="'+cls(L.r-L.m)+'">'+sign(Math.round((L.r-L.m)*10)/10)+nf1.format(Math.abs(L.r-L.m))+' pp</b></span>'
            : '<span>Tootlus ilma sissemaksete mõjuta, alates '+kp(P[0].d)+'<b class="'+cls(L.r)+'">'+pct(L.r/100)+'</b></span>'+
              (vd.length?'<span>Indeksi ajalugu selles vahemikus puudub. Käivita Apps Scriptis PF_taidaVordlus.</span>':''));
  var bs=$('segBm'); if(bs) bs.hidden=!(S.mode==='h'&&vd.length>1);
  // hover
  var tip=$('tip'), cross=$('cross');
  function move(ev){
    var r=box.getBoundingClientRect(), x=(ev.touches?ev.touches[0].clientX:ev.clientX)-r.left, best=0, bd=1e9;
    P.forEach(function(p,i){ var d=Math.abs(X(p.t)-x); if(d<bd){bd=d;best=i;} });
    var p=P[best], px=X(p.t);
    cross.style.display=''; $('cl').setAttribute('x1',px); $('cl').setAttribute('x2',px);
    ser.forEach(function(s,i){ var c=$('cd'+i); c.setAttribute('cx',px); c.setAttribute('cy',Y(p[s.k])); });
    tip.innerHTML='<strong>'+kp(p.d)+'</strong>'+(S.mode==='v'
      ? '<div><span>Väärtus</span>'+eur(p.v)+'</div><div><span>Sisse makstud</span>'+eur(p.s)+'</div><div><span>Kasum</span><b class="'+cls(p.v-p.s)+'">'+eurS(p.v-p.s)+'</b></div>'
      : '<div><span>'+(onB?'Portfell':'Tootlus')+'</span><b class="'+cls(p.r)+'">'+pct(p.r/100)+'</b></div>'+
        (onB?'<div><span>'+esc(bmN)+'</span><b class="'+cls(p.m)+'">'+pct(p.m/100)+'</b></div>':'<div><span>Osaku hind</span>'+nf2.format(p.h)+'</div>'));
    tip.style.display='block';
    var tw=tip.offsetWidth; tip.style.left=Math.max(0,Math.min(W-tw, px<W/2?px+12:px-tw-12))+'px';
  }
  function leave(){ cross.style.display='none'; tip.style.display='none'; }
  box.onmousemove=move; box.onmouseleave=leave; box.ontouchstart=move; box.ontouchmove=move; box.ontouchend=leave;
  // tabelivaade
  var rows=P.slice(-40).reverse().map(function(p){ return '<tr><td>'+kp(p.d)+'</td><td>'+eur(p.v)+'</td><td>'+eur(p.s)+'</td><td class="'+cls(p.v-p.s)+'">'+eurS(p.v-p.s)+'</td><td>'+nf2.format(p.h)+'</td></tr>'; }).join('');
  $('tblwrap').innerHTML='<details class="tbl"><summary>Näita tabelina</summary><table><thead><tr><th>Kuupäev</th><th>Väärtus</th><th>Sisse makstud</th><th>Kasum</th><th>Osaku hind</th></tr></thead><tbody>'+rows+'</tbody></table></details>';
}

// ---------- kaart (squarified treemap) ----------
function layoutrow(z,x,y,dx,dy){ var c=z.reduce(function(a,b){return a+b;},0), o=[];
  if(dx>=dy){ var w=c/dy, yy=y; z.forEach(function(s){ o.push({x:x,y:yy,dx:w,dy:s/w}); yy+=s/w; }); }
  else { var h=c/dx, xx=x; z.forEach(function(s){ o.push({x:xx,y:y,dx:s/h,dy:h}); xx+=s/h; }); } return o; }
function leftover(z,x,y,dx,dy){ var c=z.reduce(function(a,b){return a+b;},0);
  if(dx>=dy){ var w=c/dy; return {x:x+w,y:y,dx:dx-w,dy:dy}; } var h=c/dx; return {x:x,y:y+h,dx:dx,dy:dy-h}; }
function worst(z,x,y,dx,dy){ return Math.max.apply(null,layoutrow(z,x,y,dx,dy).map(function(t){return Math.max(t.dx/t.dy,t.dy/t.dx);})); }
function squarify(z,x,y,dx,dy){ if(!z.length) return []; if(z.length===1) return layoutrow(z,x,y,dx,dy);
  var i=1; while(i<z.length && worst(z.slice(0,i),x,y,dx,dy)>=worst(z.slice(0,i+1),x,y,dx,dy)) i++;
  var lo=leftover(z.slice(0,i),x,y,dx,dy); return layoutrow(z.slice(0,i),x,y,dx,dy).concat(squarify(z.slice(i),lo.x,lo.y,lo.dx,lo.dy)); }
var HEAT={ tana:{k:'tanaPr',cap:.04,n:'täna'}, nadal:{k:'nadalPr',cap:.10,n:'nädalaga'}, aasta:{k:'aastaPr',cap:.50,n:'sel aastal'} };
// Stonksmaileri värvid: hele = väike liikumine, tume = suur
var G0=[165,214,167], G1=[24,90,32], R0=[239,154,154], R1=[176,28,28];
function heatColor(f,cap){ if(!has(f)) return 'rgb(84,94,108)';
  var t=Math.sqrt(Math.min(Math.abs(f),cap)/cap), a=f>=0?G0:R0, b=f>=0?G1:R1;
  return 'rgb('+a.map(function(v,i){return Math.round(v+(b[i]-v)*t);}).join(',')+')'; }
function drawHeat(){
  var box=$('heat'); if(!box) return;
  var W=box.clientWidth, H=box.clientHeight, cfg=HEAT[S.heat]; box.innerHTML='';
  var ps=S.data.pos.filter(function(p){return p.v>0;}).sort(function(a,b){return b.v-a.v;});
  var tot=ps.reduce(function(a,p){return a+p.v;},0); if(!tot) return;
  squarify(ps.map(function(p){return p.v/tot*W*H;}),0,0,W,H).forEach(function(r,i){
    var p=ps[i], el=document.createElement('button'), s=Math.min(r.dx,r.dy), fs=Math.max(9.5,Math.min(19,s*0.24));
    el.type='button'; el.className='tile';
    el.style.cssText='left:'+(r.x+.75)+'px;top:'+(r.y+.75)+'px;width:'+Math.max(0,r.dx-1.5)+'px;height:'+Math.max(0,r.dy-1.5)+'px;background:'+heatColor(p[cfg.k],cfg.cap);
    el.title=p.kuva+': '+pct(p[cfg.k])+' '+cfg.n+', väärtus '+eur(p.v)+' ('+pct(p.osakaal).replace('+','')+' portfellist)';
    el.innerHTML=(s>24&&r.dx>fs*p.kuva.length*0.62?'<b style="font-size:'+fs+'px">'+esc(p.kuva)+'</b>':'')+(s>44?'<span style="font-size:'+(fs*0.72)+'px">'+pct(p[cfg.k])+'</span>':'');
    el.onclick=function(){ S.open=p.t; drawTable(); var tr=document.querySelector('tr.det'); if(tr) tr.scrollIntoView({block:'center',behavior:'smooth'}); };
    box.appendChild(el);
  });
  $('scale').innerHTML='<span>'+pct(-cfg.cap)+'</span><i style="background:linear-gradient(90deg,rgb('+R1+'),rgb('+R0+') 50%,rgb('+G0+') 50%,rgb('+G1+'))"></i><span>'+pct(cfg.cap)+' '+cfg.n+'</span>';
}

// ---------- positsioonide tabel ----------
var COLS=[{k:'kuva',n:'Nimi'},{k:'tanaPr',n:'Täna'},{k:'v',n:'Väärtus'},{k:'kasum',n:'Kasum'},{k:'aastaPr',n:new Date().getFullYear(),c:'col-yr'}];
function drawTable(){
  var d=S.data, k=S.sort.k, dir=S.sort.dir;
  var ps=d.pos.slice().sort(function(a,b){ var x=a[k], y=b[k];
    if(k==='kuva') return String(x).localeCompare(String(y),'et')*dir;
    return ((has(x)?x:-1e18)-(has(y)?y:-1e18))*dir; });
  var head='<tr>'+COLS.map(function(c){ var on=S.sort.k===c.k;
    return '<th class="'+(c.c||'')+'"><button type="button" data-sort="'+c.k+'" aria-sort="'+(on?(S.sort.dir>0?'ascending':'descending'):'none')+'">'+c.n+(on?(S.sort.dir>0?' ↑':' ↓'):'')+'</button></th>'; }).join('')+'</tr>';
  var body=ps.map(function(p){
    var row='<tr class="row" data-t="'+esc(p.t)+'" tabindex="0" aria-expanded="'+(S.open===p.t)+'">'+
      '<td class="nm"><b>'+esc(p.kuva)+'</b>'+(p.ok?'':'<span class="badge">vana hind</span>')+'<small>'+price(p.hind)+' '+esc(p.val)+'</small></td>'+
      '<td class="'+cls(p.tanaPr)+'">'+pct(p.tanaPr)+'<small>'+eurS(p.tana)+'</small></td>'+
      '<td class="val">'+eur(p.v)+'<small>'+(has(p.osakaal)?nf1.format(p.osakaal*100)+'%':'')+'</small></td>'+
      '<td class="'+cls(p.kasum)+'">'+eurS(p.kasum)+'<small>'+pct(p.kasumPr)+'</small></td>'+
      '<td class="col-yr '+cls(p.aastaPr)+'">'+pct(p.aastaPr)+'</td></tr>';
    if(S.open===p.t){
      var pos52=has(p.min52)&&has(p.max52)&&p.max52>p.min52?Math.max(0,Math.min(100,(p.hind-p.min52)/(p.max52-p.min52)*100)):null;
      row+='<tr class="det"><td colspan="5"><div class="detbox">'+
        '<div class="muted" style="font-size:12.5px;margin-bottom:10px">'+esc(p.nimi||p.kuva)+' ('+esc(p.t)+')</div>'+
        '<div class="detgrid">'+
          '<div><span>Kogus</span><b>'+qty(p.kogus)+'</b></div>'+
          '<div><span>Keskmine ostuhind</span><b>'+price(p.ost)+' '+esc(p.val)+'</b></div>'+
          '<div><span>Soetusmaksumus</span><b>'+eur(p.soetus)+'</b></div>'+
          '<div><span>Nädalaga</span><b class="'+cls(p.nadalPr)+'">'+pct(p.nadalPr)+'</b></div>'+
          '<div><span>Sel aastal</span><b class="'+cls(p.aastaPr)+'">'+pct(p.aastaPr)+'</b></div>'+

function aastad(d){
  var by={}, order=[];
  (d.ajalugu||[]).forEach(function(p){ var y=p.d.slice(0,4); if(!by[y]) order.push(y); by[y]=p; });
  var out=[], prev=null, viim=order[order.length-1];
  order.forEach(function(y){
    var p=by[y], r={y:y,v:p.v,s:p.s,kasumKokku:p.v-p.s};
    if(prev){
      r.sisse=p.s-prev.s; r.kasum=(p.v-p.s)-(prev.v-prev.s); r.pr=p.h/prev.h-1;
      var kuud=12; if(y===viim){ var a=ms(p.d), j=Date.UTC(+y,0,1); kuud=Math.max(0.5,(a-j)/864e5/30.44); }
      r.kuus=r.kasum/kuud;
      r.b=(d.vordlus||[]).map(function(x,i){ return p.b&&prev.b&&has(p.b[i])&&has(prev.b[i])?p.b[i]/prev.b[i]-1:null; });
    } else { r.sisse=p.s; r.kasum=p.v-p.s; r.pr=null; r.kuus=null; r.b=[]; r.esimene=true; }
    out.push(r); prev=p;
  });
  return out;
}

  $('frm').reset(); $('err').textContent='';
  var t=new Date(); $('iKp').value=t.getFullYear()+'-'+('0'+(t.getMonth()+1)).slice(-2)+'-'+('0'+t.getDate()).slice(-2); $('iKp').max=$('iKp').value;
  $('dl').innerHTML=S.data.tickerid.map(function(x){ return '<option value="'+esc(x.t)+'">'+esc(x.kuva)+'</option>'; }).join('');
  var pin=store('pf_pin'); if(pin){ $('iPin').value=pin; $('cPin').checked=true; }
  if(ticker){ $('iTicker').value=ticker; }
  syncForm(true);
  $('dlg').showModal();
  ($('iTicker').value||!(/Ost|Müük|Dividend/.test(S.tyyp)) ? (/Ost|Müük/.test(S.tyyp)?$('iKogus'):$('iSumma')) : $('iTicker')).focus();
}
function syncForm(prefill){
  var kaup=S.tyyp==='Ost'||S.tyyp==='Müük', jaak=S.tyyp==='Jääk', d=S.data;
  $('types').innerHTML=TYYBID.map(function(t){ return '<button type="button" data-t="'+t+'" aria-pressed="'+(t===S.tyyp)+'">'+(TYYP_NIMI[t]||t)+'</button>'; }).join('');
  $('fTicker').hidden=!(kaup||S.tyyp==='Dividend'); $('fTrade').hidden=!kaup; $('fTasu').hidden=!kaup; $('fSumma').hidden=kaup;
  $('lSumma').textContent=jaak?'Tegelik raha jääk, €':'Summa, €';
  var k=findTicker($('iTicker').value), p=k?held(k.t):null, hint='';
  if(!$('fTicker').hidden){
    var raw=$('iTicker').value.trim();
    if(k){ hint=esc(k.t)+', hind '+price(k.hind)+' '+esc(k.val)+(p?', sul on '+qty(p.kogus)+' tk':''); if(prefill&&kaup&&!$('iHind').value&&has(k.hind)) $('iHind').value=String(k.hind).replace('.',','); }
    else if(raw) hint = S.tyyp==='Müük' ? 'Seda väärtpaberit portfellis pole' : 'Uus ticker. Kasuta Yahoo sümbolit (nt NKE, SAP.DE); kontrollin seda salvestamisel.';
    if(S.tyyp==='Müük'&&k&&!p) hint='Seda väärtpaberit portfellis pole';
  }
  $('hTicker').innerHTML=hint;
  $('lHind').textContent='Hind'+(k?', '+k.val:'');
  $('bAll').hidden=!(S.tyyp==='Müük'&&p);
  // kokkuvõte
  var box=$('sumbox'), raha=d.kokku.raha, muutus=null, rida='';
  if(jaak){
    var siht=num($('iSumma').value);
    box.innerHTML='<div><span>Praegu arvestuses</span><b>'+eur2(raha)+'</b></div>'+(isFinite(siht)?'<div><span>Parandus</span><b>'+(siht-raha>=0?'+':'−')+eur2(Math.abs(siht-raha))+'</b></div>':'')+
      '<div style="margin-top:4px">Vahe läheb kirja parandusena ja loetakse kasumi hulka (nt arvestamata dividend või tasu). Kui tõid raha juurde või võtsid välja, kasuta sissemakset või väljamakset.</div>';
    box.hidden=false;
  } else {
    if(kaup){
      var kogus=num($('iKogus').value), hind=num($('iHind').value), tasu=num($('iTasu').value)||0, val=k?k.val:null, kurss=val==='EUR'?1:(val?d.kursid[val]:null);
      if(kogus>0&&hind>=0&&kurss){ var s=kogus*hind*kurss; muutus=S.tyyp==='Ost'?-(s+tasu):(s-tasu);
        rida='<div><span>'+(S.tyyp==='Ost'?'Maksad':'Saad')+(val!=='EUR'?' (kurss '+mkf(0,4).format(kurss)+')':'')+'</span><b>'+eur2(Math.abs(muutus))+'</b></div>'; }
    } else { var sm=num($('iSumma').value); if(sm>0) muutus=(S.tyyp==='Sissemakse'||S.tyyp==='Dividend')?sm:-sm; }
    if(muutus!==null){ var uus=raha+muutus;
      box.innerHTML=rida+'<div><span>Vaba raha pärast</span><b class="'+(uus<0?'down':'')+'">'+eur2(uus)+'</b></div>'+(uus<-0.005?'<div style="color:var(--down);margin-top:4px">Raha jääks miinusesse. Lisa enne sissemakse, kui tõid raha juurde.</div>':'');
      box.hidden=false; } else box.hidden=true;
  }
  $('bSave').textContent={Ost:'Salvesta ost','Müük':'Salvesta müük',Dividend:'Salvesta dividend',Sissemakse:'Salvesta sissemakse','Väljamakse':'Salvesta väljamakse',Tasu:'Salvesta tasu','Jääk':'Salvesta jääk'}[S.tyyp];
  $('bSave').disabled=!d.pinOlemas&&!S.demo;
  if(!d.pinOlemas&&!S.demo) $('err').textContent='Tehingute lisamiseks pane PIN faili liveapi.gs algusesse (PF_PIN) ja tee uus versioon.';
}
function submitForm(ev){
  ev.preventDefault();
  var kaup=S.tyyp==='Ost'||S.tyyp==='Müük', k=findTicker($('iTicker').value), err='';
  var t={ portfell:S.p, tyyp:S.tyyp, ticker:k?k.t:$('iTicker').value.trim().toUpperCase(), kuupaev:$('iKp').value, markus:$('iMarkus').value.trim() };
  if(kaup){ t.kogus=num($('iKogus').value); t.hind=num($('iHind').value); t.tasu=num($('iTasu').value)||0;
    if(!t.ticker) err='Vali väärtpaber'; else if(!(t.kogus>0)) err='Sisesta kogus'; else if(!(t.hind>=0)) err='Sisesta hind';
    else if(S.tyyp==='Müük'){ var p=k?held(k.t):null; if(!p) err='Seda väärtpaberit portfellis pole'; else if(t.kogus>p.kogus+1e-9) err='Sul on ainult '+qty(p.kogus)+' tk'; }
  } else if(S.tyyp==='Jääk'){
    var siht=num($('iSumma').value); t.tyyp='Korrektsioon'; t.ticker=''; t.summa=Math.round((siht-S.data.kokku.raha)*100)/100; if(!t.markus) t.markus='raha jäägi parandus';
    if(!isFinite(siht)) err='Sisesta tegelik raha jääk'; else if(Math.abs(t.summa)<0.01) err='Jääk on juba '+eur2(siht);
  } else { t.summa=num($('iSumma').value); if(!(t.summa>0)) err='Sisesta summa'; if(S.tyyp!=='Dividend') t.ticker=''; }
  if(!err&&!$('iPin').value&&!S.demo) err='Sisesta PIN';
  if(err){ $('err').textContent=err; return; }
  $('err').textContent=''; var b=$('bSave'), old=b.textContent; b.disabled=true; b.textContent='Salvestan…';
  store('pf_pin',$('cPin').checked?$('iPin').value:null);
  api('tehing',{pin:$('iPin').value,t:t},function(d){ b.disabled=false; b.textContent=old; $('dlg').close(); render(d); toast((TYYP_NIMI[S.tyyp]||S.tyyp)+' salvestatud'); },
    function(e){ b.disabled=false; b.textContent=old; $('err').textContent=e.message||String(e); if(/PIN/.test(e.message||'')) store('pf_pin',null); });
}

// ---------- sündmused ----------
document.addEventListener('click',function(ev){
  var b=ev.target.closest('button'), row;
  if(b){
    if(b.dataset.fold){ var fid=b.dataset.fold; if(S.kinni[fid]) delete S.kinni[fid]; else S.kinni[fid]=1; store('pf_kinni',JSON.stringify(S.kinni)); render(); return; }
    var seg=b.parentNode.id;
    if(seg==='nav'){ S.view=b.dataset.view; if(S.data) render(); else if(S.view==='seaded') fail(new Error('Andmeid pole veel laetud.')); else load(); window.scrollTo(0,0); return; }
    if(seg==='segMode'){ S.mode=b.dataset.v; render(); return; }
    if(seg==='segRange'){ S.range=b.dataset.v; render(); return; }
    if(seg==='segBm'){ S.bm=+b.dataset.v; S.mode='h'; render(); return; }
    if(seg==='segHeat'){ S.heat=b.dataset.v; [].forEach.call(b.parentNode.children,function(x){ x.setAttribute('aria-pressed',x===b); }); drawHeat(); return; }
    if(seg==='types'){ S.tyyp=b.dataset.t; $('err').textContent=''; syncForm(true); return; }
    if(b.dataset.sort){ var k=b.dataset.sort; S.sort=S.sort.k===k?{k:k,dir:-S.sort.dir}:{k:k,dir:k==='kuva'?1:-1}; drawTable(); return; }
    if(b.dataset.act){ openForm(b.dataset.act,b.dataset.tk); return; }
    if(b.dataset.varaSalvesta){ salvestaVara(b.dataset.varaSalvesta,$('veKogus')?{kogus:$('veKogus').value,ost:$('veOst').value}:{v:$('veVal').value},$('vePin')); return; }
    if(b.dataset.varaKustuta){ kustutaVara(b.dataset.varaKustuta,b,$('vePin')); return; }
    if(b.dataset.varaTais){ $('nvName').value=b.dataset.varaTais; ($('nvVal')||$('nvKogus')).focus(); return; }
    if(b.id==='nvAdd'){ salvestaVara($('nvName').value.trim(),$('nvKogus')?{kogus:$('nvKogus').value,ost:$('nvOst').value}:{v:$('nvVal').value},$('nvPin')); return; }
    if(b.parentNode.id==='segVara'){ S.varaTyyp=b.dataset.v; render(); return; }
    if(b.parentNode.id==='segVaraE'){ S.varaAvaTyyp=b.dataset.v; render(); var ve=$('veKogus')||$('veVal'); if(ve) ve.focus(); return; }
    if(b.id==='kopeeri'){ kopeeriSkript(); return; }
    if(b.id==='sUrlSave'){ var u=$('sUrl').value.trim();
      if(!/^https:\/\/script\.google\.com\/.+\/exec/.test(u)){ toast('Link peab algama https://script.google.com/ ja lõppema /exec'); return; }
      store('pf_api',u); S.data=null; S.view='portfell'; load(); toast('Link salvestatud'); return; }
    if(b.id==='sUrlClear'){ store('pf_api',null); S.data=null; load(); toast('Link eemaldatud'); return; }
    if(b.id==='sPinSave'){ store('pf_pin',$('sPin').value||null); toast($('sPin').value?'PIN jäeti meelde':'PIN on tühi'); return; }
    if(b.id==='sPinClear'){ store('pf_pin',null); $('sPin').value=''; toast('PIN unustatud'); return; }
    if(b.id==='btnAdd'){ openForm('Ost'); return; }
    if(b.id==='btnRefresh'){ load(null,'varskenda'); return; }
    if(b.id==='dlgX'){ $('dlg').close(); return; }
    if(b.id==='bAll'){ var k2=findTicker($('iTicker').value), p=k2?held(k2.t):null; if(p){ $('iKogus').value=String(p.kogus).replace('.',','); syncForm(); } return; }
    return;
  }
  var sk=ev.target.closest('[data-sektor]'); if(sk){ S.varaValik=S.varaValik===sk.getAttribute('data-sektor')?null:sk.getAttribute('data-sektor'); render(); return; }
  if(S.varaValik&&S.view==='ulevaade'&&ev.target.closest('.varagraaf')){ S.varaValik=null; render(); return; }
  if(ev.target.closest('[data-cash]')){ openForm('Jääk'); return; }
  var va=ev.target.closest('[data-vara-ava]'); if(va){ S.varaAva=S.varaAva===va.dataset.varaAva?null:va.dataset.varaAva; S.varaAvaTyyp=null; render(); var vi=$('veVal')||$('veKogus'); if(vi) vi.focus(); return; }
  row=ev.target.closest('tr.row');
  if(row){ S.open=S.open===row.dataset.t?null:row.dataset.t; drawTable(); }
});
document.addEventListener('keydown',function(ev){ if((ev.key==='Enter'||ev.key===' ')&&ev.target.matches&&ev.target.matches('tr.row,[data-vara-ava],[data-sektor]')){ if(ev.target.matches('[data-sektor]')){ ev.preventDefault(); S.varaValik=S.varaValik===ev.target.getAttribute('data-sektor')?null:ev.target.getAttribute('data-sektor'); render(); return; } ev.preventDefault(); ev.target.click(); } });
$('frm').addEventListener('input',function(ev){ if(ev.target.id!=='iPin'&&ev.target.id!=='iMarkus') syncForm(ev.target.id==='iTicker'); });
$('frm').addEventListener('submit',submitForm);
$('dlg').addEventListener('click',function(ev){ if(ev.target===$('dlg')) $('dlg').close(); });
var rz; window.addEventListener('resize',function(){ clearTimeout(rz); rz=setTimeout(function(){ if(S.data&&S.view==='portfell'){ drawChart(); drawDay(); drawHeat(); } },120); });
setInterval(function(){ if(!document.hidden&&S.data&&!$('dlg').open&&S.view!=='seaded') load(); },5*60*1000);
// Avakuvale paigaldatav rakendus: ainult siis, kui leht tuleb oma veebiaadressilt (nt GitHub Pages), mitte Apps Scriptist ega failist.
if(!INSIDE && location.protocol==='https:' || location.hostname==='localhost'){
  var ml=document.createElement('link'); ml.rel='manifest'; ml.href='manifest.webmanifest'; document.head.appendChild(ml);
  var al=document.createElement('link'); al.rel='apple-touch-icon'; al.href='icon-192.png'; document.head.appendChild(al);
  if('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(function(){});
}
load();
</script>
